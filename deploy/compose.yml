# Production stack (M0-10, ADR-0041): run from /home/deploy/quode on the VPS with
#   docker compose pull && docker compose up -d
# Values come from .env next to this file (see .env.example); it exists only on the server.
#
# Docker publishes ports past ufw: only caddy publishes on public interfaces. The database and
# Actuator are published on the host's 127.0.0.1 only, reached through an SSH tunnel.

name: quode

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: ${QUODE_REGISTRY:-ghcr.io/luca-impruvius}/quode-frontend:${QUODE_TAG:?set QUODE_TAG in .env}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      QUODE_DOMAIN: ${QUODE_DOMAIN:?set QUODE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive redeploys, so Let's Encrypt is asked only once.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 256m
    networks: [app]
    logging: *logging

  backend:
    image: ${QUODE_REGISTRY:-ghcr.io/luca-impruvius}/quode-backend:${QUODE_TAG:?set QUODE_TAG in .env}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quode
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      QUODE_ALLOWED_EMAILS: ${QUODE_ALLOWED_EMAILS:?set QUODE_ALLOWED_EMAILS in .env}
      # Actuator listens on all container interfaces; the port below is published on localhost only.
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    # The heap is 65% of this (ENTRYPOINT in backend/Dockerfile), about 830 MB.
    mem_limit: 1280m
    networks: [app]
    logging: *logging

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: quode
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Read by initdb/10-readonly-role.sh on the first start of an empty volume.
      QUODE_READONLY_PASSWORD: ${QUODE_READONLY_PASSWORD:?set QUODE_READONLY_PASSWORD in .env}
    # Sized for a 4 GB server shared with the backend and Caddy.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=50
    ports:
      # For DBeaver through an SSH tunnel, with the read-only role. Never on a public interface.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    networks: [app]
    logging: *logging

networks:
  app:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
