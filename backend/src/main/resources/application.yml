spring:
  application:
    name: quode
  threads:
    virtual:
      # Tomcat handles each request on a virtual thread (ADR-0034).
      enabled: true
  datasource:
    # Local defaults match compose.dev.yml; production sets all three (application-prod.yml).
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/quode}
    username: ${DB_USER:quode}
    password: ${DB_PASSWORD:quode}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    # No lazy loading during view rendering: transactions end in the service layer.
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            # The "Quode local" or "Quode production" OAuth client (docs/architecture.md §4).
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
  session:
    # Sessions live in Postgres (ADR-0017) and end after 30 days without a request.
    timeout: 30d
    jdbc:
      # Flyway owns the tables (V2__create_spring_session.sql).
      initialize-schema: never

quode:
  security:
    # Google accounts allowed to sign in (comma-separated, any case). Empty means nobody.
    allowed-emails: ${QUODE_ALLOWED_EMAILS:}

server:
  servlet:
    # Caddy forwards /api/* unchanged, so every backend URL starts with /api.
    context-path: /api
    session:
      cookie:
        http-only: true
        # Browsers accept Secure cookies on http://localhost too.
        secure: true
        same-site: lax

management:
  server:
    # A separate port keeps Actuator off the public port entirely.
    port: 8081
    # Localhost only by default; in a container set MANAGEMENT_SERVER_ADDRESS=0.0.0.0
    # and publish the port on 127.0.0.1 of the host only (reach it through an SSH tunnel).
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  tracing:
    sampling:
      # Trace every request: there is no exporter, the ID only links responses to log lines.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, loggers
  endpoint:
    health:
      group:
        public:
          include: "*"
          show-details: never
          show-components: never
          # Also serve this group on the main server (under the context path): /api/health.
          additional-path: server:/health
---
# Local secrets from the git-ignored .env (see .env.example), whether started from backend/ or the
# repository root. Never in prod: there, real environment variables only.
spring:
  config:
    activate:
      on-profile: "!prod"
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
