logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema), readable with jq.
      console: ecs
springdoc:
  api-docs:
    # The OpenAPI spec is for generating frontend types locally, not served in production.
    enabled: false
spring:
  datasource:
    # No defaults: production fails fast instead of falling back to the dev credentials.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

quode:
  security:
    # No default: production must name its allowed accounts explicitly.
    allowed-emails: ${QUODE_ALLOWED_EMAILS}

server:
  # Behind Caddy: trust X-Forwarded-Proto/Host, so the OAuth callback URL is https://<domain>.
  # Not testable until the VPS exists (M0-10).
  forward-headers-strategy: native
