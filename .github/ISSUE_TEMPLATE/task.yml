name: Task
description: A unit of work that fits 1-2 evenings
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task achieves, in one or two sentences.
    validations:
      required: true
  - type: dropdown
    id: review
    attributes:
      label: Review
      description: Careful for security, data, CI, infrastructure or backups; also add the review:careful label.
      options:
        - Standard
        - Careful (owner reads the whole diff)
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist that proves the task is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions needed
      description: Anything to decide before or during the task. If it affects other modules, it becomes an ADR.
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12, #13"
  - type: input
    id: spec
    attributes:
      label: Spec or design link
      placeholder: docs/specs/... or canvas screen name
